name: CI/CD GitOps Website a Main

on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/viscarra-core/viscarra-website:latest
            ghcr.io/viscarra-core/viscarra-website:${{ github.sha }}

      - name: Actualizar archivo de Kubernetes YAML
        run: |
          sed -i "s|image: ghcr.io/viscarra-core/viscarra-website:.*|image: ghcr.io/viscarra-core/viscarra-website:${{ github.sha }}|g" k8s/despliegue.yaml
          
      - name: Subir cambios de Kubernetes al repositorio
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add k8s/despliegue.yaml
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: actualizar version de imagen a ${{ github.sha }} [skip ci]"
          git push origin main